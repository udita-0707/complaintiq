# Issue taxonomy (SPEC C4 steps 3-4). `merges` is curated by hand; `mapping` is
# regenerated by `make data-mappings` from merges + counts + taxonomy.issue_top_n.
version: 1
other_label: OTHER
# Harmonized issues kept as explicit classes regardless of top-N (severity issues, M2 review).
force_keep:
  - Problem with fraud alerts or security freezes
  - Unauthorized transactions or other transaction problem
  - Threatened to contact someone or share information improperly
# Same-meaning renames across the 2017-04-24 and 2023-08-25 CFPB taxonomy changes:
# raw Issue -> harmonized Issue (the current wording). Unlisted values keep their name.
merges:
  # Credit reporting
  Incorrect information on credit report: Incorrect information on your report
  Problem with a credit reporting company's investigation into an existing problem: Problem with a company's investigation into an existing problem
  Credit reporting company's investigation: Problem with a company's investigation into an existing problem
  Problem with a company's investigation into an existing issue: Problem with a company's investigation into an existing problem
  Improper use of my credit report: Improper use of your report
  Unable to get credit report/credit score: Unable to get your credit report or credit score
  Credit monitoring or identity protection: Credit monitoring or identity theft protection services
  Identity theft protection or other monitoring services: Credit monitoring or identity theft protection services
  # Debt collection
  Cont'd attempts collect debt not owed: Attempts to collect debt not owed
  Disclosure verification of debt: Written notification about debt
  Taking/threatening an illegal action: Took or threatened to take negative or legal action
  Improper contact or sharing of info: Threatened to contact someone or share information improperly
  Electronic communications: Communication tactics
  # Mortgage
  Loan servicing, payments, escrow account: Trouble during payment process
  Loan modification,collection,foreclosure: Struggling to pay mortgage
  Application, originator, mortgage broker: Applying for a mortgage or refinancing an existing mortgage
  Credit decision / Underwriting: Applying for a mortgage or refinancing an existing mortgage
  Settlement process and costs: Closing on a mortgage
  # Student / vehicle / personal loans
  Dealing with my lender or servicer: Dealing with your lender or servicer
  Can't repay my loan: Struggling to repay your loan
  Problems when you are unable to pay: Struggling to pay your loan
  Taking out the loan or lease: Getting a loan or lease
  Repossession: Vehicle was repossessed or sold the vehicle
  Lender repossessed or sold the vehicle: Vehicle was repossessed or sold the vehicle
  Lender damaged or destroyed vehicle: Vehicle was damaged or destroyed the vehicle
  Lender sold the property: Property was sold
  Lender damaged or destroyed property: Property was damaged or destroyed property
  Received a loan I didn't apply for: Received a loan you didn't apply for
  Can't contact lender: Can't contact lender or servicer
  Payment to acct not credited: Loan payment wasn't credited to your account
  Applied for loan/did not receive money: Was approved for a loan, but didn't receive the money
  Was approved for a loan, but didn't receive money: Was approved for a loan, but didn't receive the money
  Charged bank acct wrong day or amt: Money was taken from your bank account on the wrong day or for the wrong amount
  Can't stop charges to bank account: Can't stop withdrawals from your bank account
  # Bank accounts
  Account opening, closing, or management: Managing an account
  Deposits and withdrawals: Managing an account
  Using a debit or ATM card: Managing an account
  Problems caused by my funds being low: Problem caused by your funds being low
  Overdraft, savings or rewards features: Overdraft, savings, or rewards features
  Problem with an overdraft: Problem with overdraft
  # Cards / payments
  Billing disputes: Problem with a purchase shown on your statement
  Charged fees or interest I didn't expect: Charged fees or interest you didn't expect
  Closing/Cancelling account: Closing your account
  Advertising and marketing: Advertising and marketing, including promotional offers
  Trouble using the card: Trouble using your card
  Unauthorized transactions/trans. issues: Unauthorized transactions or other transaction problem
  Other transaction issues: Other transaction problem
  Adding money: Problem adding money
  Unexpected/Other fees: Unexpected or other fees
  Customer service/Customer relations: Customer service / Customer relations
