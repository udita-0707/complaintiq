# Serving config (M3 wiring). The predictor kind is chosen by configs/model.yaml: predictor.
# If the chosen artifact is missing (or its libraries are not installed), the API falls back
# to the stub predictor with a logged warning and model_version below.
fallback_model_version: stub
baseline:
  # M4: the primary model (converged tfidf_sgd_alpha2e-6 rerun + priority; configs/eval.yaml).
  # Its temperatures and priority threshold come from configs/thresholds.yaml.
  model_dir: models/baseline/tfidf_sgd_alpha2e-6_conv
transformer:
  model_dir: models/transformer          # {product,issue,priority}/ from `make train-transformer`
